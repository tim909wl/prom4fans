name: Deploy static site via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm run lint

      - name: Build standalone app
        env:
          FORM_SECRET: ${{ secrets.FORM_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://prom4fans.com' }}
        run: npm run build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -t rsa,ecdsa -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Upload standalone app
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_PATH: ${{ secrets.NODE_APP_PATH || 'prom4fans-app' }}
          FORM_SECRET: ${{ secrets.FORM_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CONTACT_RECEIVER_EMAIL: ${{ secrets.CONTACT_RECEIVER_EMAIL }}
        run: |
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_PATH'"
          sshpass -e rsync -az --delete -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" .next/standalone/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"
          sshpass -e rsync -az --delete -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" .next/static/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.next/static/"
          sshpass -e rsync -az --delete -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" public/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/public/"
          # Apache serves ~/public; keep the PHP form endpoint available there too.
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p public/api"
          sshpass -e rsync -az -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" public/api/kontakt.php "$SSH_USER@$SSH_HOST:public/api/kontakt.php"
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "printf '%s\n' 'FORM_SECRET=$FORM_SECRET' 'SMTP_HOST=$SMTP_HOST' 'SMTP_PORT=$SMTP_PORT' 'SMTP_USER=$SMTP_USER' 'SMTP_PASS=$SMTP_PASS' 'SMTP_FROM=$SMTP_FROM' 'CONTACT_RECEIVER_EMAIL=$CONTACT_RECEIVER_EMAIL' > '$REMOTE_PATH/.env'"
          timeout 45s sshpass -e ssh -n -o BatchMode=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "export NVM_DIR=\"\$HOME/.xconfig/nvm\"; . \"\$NVM_DIR/nvm.sh\"; NODE20=\"\$(which node)\"; cd '$REMOTE_PATH'; ~/node_modules/.bin/pm2 delete prom4fans 2>/dev/null || true; FORM_SECRET=\"\$(grep '^FORM_SECRET=' .env | cut -d= -f2-)\" ~/node_modules/.bin/pm2 start server.js --name prom4fans --interpreter \"\$NODE20\" --update-env; ~/node_modules/.bin/pm2 save >/dev/null 2>&1 </dev/null; exit 0" || echo "PM2 restart command timed out; deployment files are already uploaded."
