name: Deploy static site via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm run lint

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.prom4fans.com' }}
        run: |
          npm run static

          # Next's static export writes clean routes as .html files. On this
          # Apache host, nested routes also create same-named directories.
          # Give every route a physical DirectoryIndex as a fallback.
          while IFS= read -r -d '' file; do
            rel="${file#out/}"
            route="${rel%.html}"
            case "$route" in
              index|404) continue ;;
            esac
            mkdir -p "out/$route"
            cp "$file" "out/$route/index.html"
          done < <(find out -type f -name '*.html' -print0)

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -t rsa,ecdsa -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Upload static site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH || 'public' }}
        run: |
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -az --delete -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" out/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"
          # The form endpoint runs in PHP on the Apache host, not in Next.js.
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_PATH/api'"
          sshpass -e rsync -az -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" public/api/kontakt.php "$SSH_USER@$SSH_HOST:$REMOTE_PATH/api/kontakt.php"
          sshpass -e rsync -az -e "ssh -o StrictHostKeyChecking=yes -p $SSH_PORT" .htaccess "$SSH_USER@$SSH_HOST:$REMOTE_PATH/.htaccess"

      - name: Verify production routes
        run: |
          sleep 3
          for url in \
            https://www.prom4fans.com/de \
            https://www.prom4fans.com/en \
            https://www.prom4fans.com/kontakt \
            https://www.prom4fans.com/de/creator-management \
            https://www.prom4fans.com/de/onlyfans-management \
            https://www.prom4fans.com/ratgeber \
            https://www.prom4fans.com/ratgeber/onlyfans-starten \
            https://www.prom4fans.com/ratgeber/creator-management-agentur; do
            status="$(curl -L -sS -o /dev/null -w '%{http_code}' "$url")"
            echo "$url -> $status"
            test "$status" = "200"
          done
